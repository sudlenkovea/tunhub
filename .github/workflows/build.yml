name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── macOS: native Swift app → .dmg ────────────────────────────────────────
  macos:
    runs-on: macos-latest          # newest image → newest macOS SDK (Liquid Glass on macOS 26)
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (newest SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build app + DMG (ad-hoc signed)
        run: |
          chmod +x *.sh
          ./make-dmg.sh
        env:
          IDENTITY: "-"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: TunHub-macos-dmg
          path: dist/TunHub.dmg
          if-no-files-found: error

  # ── Windows: native Win32 (C++/MSVC) → .msi ───────────────────────────────
  # No .NET and no WindowsAppSDK. The previous WinUI 3 build shipped ~200 MB, of which ~175 MB
  # was runtime and toolkit; this one is our binaries plus the tunnel cores.
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows-native
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (tunnel cores)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Install WiX v5
        working-directory: .
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build app + helper + cores + MSI
        shell: pwsh
        run: .\build.ps1

      - name: Report payload size
        shell: pwsh
        run: |
          $size = (Get-ChildItem dist\TunHub -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("staged payload: {0:N1} MB" -f $size)
          Get-ChildItem dist\TunHub | Sort-Object Length -Descending |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: TunHub-windows-msi
          path: windows-native/dist/*.msi
          if-no-files-found: error
